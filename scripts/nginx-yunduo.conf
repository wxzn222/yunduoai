# AI 云朵 · nginx 站点配置
#
# 80 端口直接提供网站，不再跳转 HTTPS：
#   之前用自签证书跑 HTTPS，浏览器会因为证书不受信任而拦截，
#   访客要先点"高级 → 继续前往"才能进，体验不好。
# 443 端口保留着：等有了正式域名和受信任的证书，把访问切回去即可，
# 届时把这个文件里 server 80 段落的 proxy 配置删掉、恢复 301 跳转。

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # 聊天回复是流式的，必须关掉缓冲，否则回复会攒着一次性蹦出来
        proxy_buffering off;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/yunduo.crt;
    ssl_certificate_key /etc/nginx/ssl/yunduo.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
